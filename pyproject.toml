[build-system]
requires = ["hatchling>=1.26.3", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "chessimg2pos"
description = "Chess image to FEN: recognize chess positions from chessboard screenshots and diagrams using deep learning (PyTorch)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["chess", "FEN", "image to FEN", "chess image to FEN", "chessboard recognition", "chess position recognition", "chess screenshot", "chess diagram", "chess vision", "lichess", "chess.com", "deep learning", "PyTorch", "CNN", "computer vision", "image recognition"]
authors = [
  { name = "Marco Di Ciò", email = "marcodicio.md@gmail.com" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Games/Entertainment :: Board Games",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  "torch>=2.0.0",
  "torchvision>=0.15.0",
  "numpy>=1.24.0",
  "matplotlib>=3.7.0",
  "Pillow>=10.0.0",
  "pandas>=2.0.0",
  "requests>=2.28.0"
]
dynamic = ["version"]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.17"]

[project.scripts]
chessimg2pos = "chessimg2pos.cli:main"

[project.urls]
Homepage = "https://github.com/mdicio/chessimg2pos"
Repository = "https://github.com/mdicio/chessimg2pos"
Issues = "https://github.com/mdicio/chessimg2pos/issues"
Documentation = "https://github.com/mdicio/chessimg2pos#readme"
Changelog = "https://github.com/mdicio/chessimg2pos/releases"

[tool.hatch.version]
path = "src/chessimg2pos/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/chessimg2pos"]


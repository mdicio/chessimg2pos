[build-system]
requires = ["hatchling>=1.26.3"]
build-backend = "hatchling.build"

[project]
name = "chessimg2pos"
description = "Chess image to FEN: recognize chess positions from screenshots, diagrams and photos of a chessboard. Finds the board, reads all 64 squares, detects orientation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["chess", "FEN", "image to FEN", "chess image to FEN", "chessboard recognition", "chess position recognition", "chess screenshot", "chess diagram", "chess vision", "lichess", "chess.com", "deep learning", "PyTorch", "ONNX", "computer vision", "image recognition"]
authors = [
  { name = "Marco Di Ciò", email = "marcodicio.md@gmail.com" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Games/Entertainment :: Board Games",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  "onnxruntime>=1.17",
  "numpy>=1.24.0",
  "Pillow>=10.0.0",
  "requests>=2.28.0"
]
dynamic = ["version"]

[project.optional-dependencies]
# training, ONNX export and .pt checkpoints (inference does not need it)
torch = ["torch>=2.0.0", "torchvision>=0.15.0"]
dev = ["pytest>=7"]

[project.scripts]
chessimg2pos = "chessimg2pos.cli:main"

[project.urls]
Homepage = "https://github.com/mdicio/chessimg2pos"
Repository = "https://github.com/mdicio/chessimg2pos"
Issues = "https://github.com/mdicio/chessimg2pos/issues"
Documentation = "https://github.com/mdicio/chessimg2pos#readme"
Changelog = "https://github.com/mdicio/chessimg2pos/releases"

[tool.hatch.version]
path = "src/chessimg2pos/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/chessimg2pos"]

